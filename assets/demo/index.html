<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReCaVSR — Video Comparison</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111318; color: #f1f3f7; }
    main { max-width: 1200px; margin: auto; padding: 24px; }
    h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); margin: 0 0 8px; }
    p { color: #b9c0cc; margin: 0 0 20px; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; min-width: 0; }
    figcaption { font-weight: 600; margin-bottom: 8px; }
    video { display: block; width: 100%; height: auto; background: #000; border-radius: 8px; }
    .controls { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    button { border: 0; border-radius: 6px; background: #5e85ff; color: #fff; font: inherit; font-weight: 600; padding: 10px 16px; cursor: pointer; }
    button:hover { background: #7698ff; }
    input[type="range"] { flex: 1; min-width: 0; }
    .downloads { margin-top: 18px; }
    a { color: #9bb7ff; }
  </style>
</head>
<body>
  <main>
    <h1>ReCaVSR video comparison</h1>
    <p>Both videos contain all 361 frames. Only the bottom label strip was cropped.</p>
    <div class="comparison">
      <figure>
        <figcaption>Low-resolution input · 488 × 830</figcaption>
        <video id="input" src="input.mp4" poster="input-poster.jpg" preload="metadata" playsinline muted></video>
      </figure>
      <figure>
        <figcaption>ReCaVSR output (4×) · 1952 × 3320</figcaption>
        <video id="output" src="output.mp4" poster="output-poster.jpg" preload="metadata" playsinline muted></video>
      </figure>
    </div>
    <div class="controls">
      <button id="play" type="button">Play both</button>
      <input id="seek" type="range" min="0" max="15.04" step="0.01" value="0" aria-label="Seek both videos">
      <span id="time">0:00</span>
    </div>
    <p class="downloads">Full-resolution files: <a href="input.mp4">input MP4</a> · <a href="output.mp4">output MP4</a></p>
  </main>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const play = document.getElementById('play');
    const seek = document.getElementById('seek');
    const time = document.getElementById('time');

    play.addEventListener('click', async () => {
      if (!output.paused) {
        input.pause();
        output.pause();
        play.textContent = 'Play both';
        return;
      }
      if (output.ended) {
        input.currentTime = 0;
        output.currentTime = 0;
      }
      input.currentTime = output.currentTime;
      try {
        await Promise.all([input.play(), output.play()]);
        play.textContent = 'Pause both';
      } catch {
        input.pause();
        output.pause();
      }
    });

    output.addEventListener('loadedmetadata', () => {
      seek.max = output.duration;
    });
    output.addEventListener('timeupdate', () => {
      seek.value = output.currentTime;
      time.textContent = `0:${String(Math.floor(output.currentTime)).padStart(2, '0')}`;
      if (!output.paused && Math.abs(input.currentTime - output.currentTime) > 0.25) {
        input.currentTime = output.currentTime;
      }
    });
    output.addEventListener('ended', () => {
      input.pause();
      play.textContent = 'Play both';
    });
    seek.addEventListener('input', () => {
      input.currentTime = Number(seek.value);
      output.currentTime = Number(seek.value);
    });
  </script>
</body>
</html>
