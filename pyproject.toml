[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recavsr-inference"
version = "0.1.0"
description = "Streaming video super-resolution with ReCaVSR"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.10.0", "triton>=3.6,<3.7",
  "diffusers==0.37.1", "safetensors>=0.7",
  "einops>=0.8", "numpy>=2", "av>=17",
  "opencv-python-headless>=4.13",
]

[dependency-groups]
dev = ["ruff>=0.12", "build>=1"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
include = ["recavsr_infer*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["recavsr_infer/models"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
